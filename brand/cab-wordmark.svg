<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 170" width="780" height="170" role="img" aria-label="Construction AI Brief">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
      .display { font-family: 'Fraunces', Georgia, serif; font-weight: 900; font-variation-settings: "SOFT" 25, "WONK" 1, "opsz" 96; letter-spacing: -2px; }
      .meta { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; letter-spacing: 0.5px; }
